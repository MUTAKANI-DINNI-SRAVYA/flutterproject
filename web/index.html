<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Grocery Inventory System - College Mini Project">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grocery Inventory">

  <title>Grocery Inventory System</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #F8F9FA;
      margin: 0;
      padding: 0;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1B5E20;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #E8F5E9;
      border-top: 4px solid #1B5E20;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div style="font-weight: 600; font-size: 15px;">Loading Grocery Inventory System...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
